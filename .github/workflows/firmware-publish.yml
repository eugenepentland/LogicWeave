name: Build Zig Firmware

on:
  push:
    paths:
      - 'build.zig.zon'
      - 'src/**'
  pull_request:
    paths:
      - 'build.zig.zon'

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive # <--- ADD THIS LINE

      - name: Check if version changed
        id: check_version
        run: |
          NEW_VER=$(grep -oP '\.version\s*=\s*"\K[^"]+' build.zig.zon || echo "unknown")
          OLD_VER=$(git show HEAD~1:build.zig.zon 2>/dev/null | grep -oP '\.version\s*=\s*"\K[^"]+' || echo "none")
          
          echo "Previous Version: $OLD_VER"
          echo "Current Version:  $NEW_VER"
          
          if [ "$NEW_VER" != "$OLD_VER" ] && [ "$NEW_VER" != "unknown" ]; then
            echo "Version bumped detected."
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$NEW_VER" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged. Skipping build."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Zig
        if: steps.check_version.outputs.changed == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: Build Firmware Variants
        if: steps.check_version.outputs.changed == 'true'
        working-directory: src/examples
        run: |
          echo "Building firmware version ${{ steps.check_version.outputs.version }}..."
          zig build firmware -Dexample-name=lw_core
          zig build firmware -Dexample-name=lw_rp2040
          zig build firmware -Dexample-name=lw_rp2350
          zig build firmware -Dexample-name=lw_rp2350b

      - name: Create Release
        if: steps.check_version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check_version.outputs.version }}
          name: Release v${{ steps.check_version.outputs.version }}
          draft: false
          prerelease: false
          # The glob below will now pick up the renamed files automatically
          files: src/examples/zig-out/firmware/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}