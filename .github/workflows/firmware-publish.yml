name: Build Zig Firmware

on:
  push:
    paths:
      - 'build.zig.zon'
      - 'src/**'
  pull_request:
    paths:
      - 'build.zig.zon'

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Manually checkout submodules (Non-Recursive)
        run: |
          # Manually init ONLY the top-level submodules
          git submodule update --init --force

      - name: Check if version needs release
        id: check_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Extract the current version from build.zig.zon
          CURRENT_VER=$(grep -oP '\.version\s*=\s*"\K[^"]+' build.zig.zon || echo "unknown")
          
          echo "Detected Version in file: $CURRENT_VER"
          
          if [ "$CURRENT_VER" == "unknown" ]; then
             echo "Could not detect version."
             exit 1
          fi

          # 2. Check GitHub API to see if this release tag already exists
          if gh release view "v$CURRENT_VER" > /dev/null 2>&1; then
            echo "Release v$CURRENT_VER already exists. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "Release v$CURRENT_VER does NOT exist. Starting build..."
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VER" >> $GITHUB_OUTPUT
          fi

      - name: Setup Zig
        if: steps.check_version.outputs.should_build == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: Build Firmware Variants
        if: steps.check_version.outputs.should_build == 'true'
        working-directory: src/examples
        run: |
          echo "Building firmware version ${{ steps.check_version.outputs.version }}..."
          zig build firmware -Dexample-name=lw_core
          zig build firmware -Dexample-name=lw_rp2040
          zig build firmware -Dexample-name=lw_rp2350
          zig build firmware -Dexample-name=lw_rp2350b

      - name: Create Release
        if: steps.check_version.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check_version.outputs.version }}
          name: Release v${{ steps.check_version.outputs.version }}
          draft: false
          prerelease: false
          files: src/examples/zig-out/firmware/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}