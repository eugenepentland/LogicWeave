name: Build Zig Firmware

on:
  push:
    paths:
      - 'build.zig.zon' # Optimization: Only trigger workflow if this file is touched
      - 'src/**'        # Optional: You might want to trigger on src changes too, but logic below handles version check
  pull_request:
    paths:
      - 'build.zig.zon'

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Required to compare against the previous commit

      - name: Check if version changed
        id: check_version
        run: |
          # Extract version from current build.zig.zon
          # Regex looks for: .version = "X.Y.Z"
          NEW_VER=$(grep -oP '\.version\s*=\s*"\K[^"]+' build.zig.zon || echo "unknown")
          
          # Extract version from previous commit (HEAD~1)
          # We use "|| echo none" to handle cases where the file didn't exist previously
          OLD_VER=$(git show HEAD~1:build.zig.zon 2>/dev/null | grep -oP '\.version\s*=\s*"\K[^"]+' || echo "none")
          
          echo "Previous Version: $OLD_VER"
          echo "Current Version:  $NEW_VER"
          
          if [ "$NEW_VER" != "$OLD_VER" ] && [ "$NEW_VER" != "unknown" ]; then
            echo "Version bumped detected."
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$NEW_VER" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged. Skipping build."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Zig
        if: steps.check_version.outputs.changed == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1 # Change to specific version (e.g., 0.13.0) if needed

      - name: Build Firmware Variants
        if: steps.check_version.outputs.changed == 'true'
        working-directory: src/examples
        run: |
          echo "Building firmware version ${{ steps.check_version.outputs.version }}..."
          
          echo "Building lw_core..."
          zig build firmware -Dexample-name=lw_core
          
          echo "Building lw_pico..."
          zig build firmware -Dexample-name=lw_pico
          
          echo "Building lw_pico2..."
          zig build firmware -Dexample-name=lw_pico2
          
          echo "Building lw_pico2b..."
          zig build firmware -Dexample-name=lw_pico2b

      # Optional: Upload the results so you can download them from GitHub
      - name: Upload Artifacts
        if: steps.check_version.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.check_version.outputs.version }}
          # Adjust this path to where your zig build outputs the files (usually zig-out/bin)
          path: src/examples/zig-out/bin/*